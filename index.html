<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Casamento - Isabela e Murilo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS Local -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="card-container">

  <!-- FOTO DO TOPO -->
  <div class="top-photo-wrapper">
    <img src="imagens/casal-foto1.jpg" alt="Foto Casal Topo" onerror="this.src='https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80'">
  </div>
  <!-- CONTEÚDO PRINCIPAL (Tudo fica aqui dentro) -->
  <div class="main-content">
    
    <!-- CONTAINER DOS NOMES COM A DECORAÇÃO -->
    <div class="names-container">
      <img src="imagens/arabesco-esquerda.png" alt="Detalhe" class="left-decoration">
      <h1 class="couple-names">
        Isabela
        <span>&</span>
        Murilo
      </h1>
    </div> 
      
      <!-- TEXTO DE CONVITE -->
      <p class="invitation-text">
        Com a bênção de Deus e com muita alegria que convidamos você para a celebração do nosso casamento
      </p>

      <!-- LOCAL E HORA -->
      <div class="location-info">
        <div class="divider-line"></div>
        <p class="location-text">Na Igreja Nossa Senhora da Paz</p>
        <div class="divider-line"></div>
      </div>

      <div class="time-text">
        <i class="far fa-clock"></i>
        <span>17H PONTUALMENTE</span>
      </div>
    <!-- SEÇÃO DA DATA COM DECORAÇÕES -->
<div class="date-wrapper">
  
  <!-- Imagem acima da data -->
  <img src="imagens/arabesco-coracao-cima.png" alt="Decoração Topo" class="date-deco date-deco-top">

      <!-- DATA EM DESTAQUE -->
      <div class="date-badge">
        26.04
      </div>
<!-- Imagem embaixo da data -->
  <img src="imagens/arabesco-coracao-baixo.png" alt="Decoração Base" class="date-deco date-deco-bottom">
</div>
  

      <!-- INSTRUÇÃO -->
      <p class="touch-instruction">Toque para interagir</p>

      <!-- BOTÕES INTERATIVOS -->
      <div class="interactive-buttons">

        <a href="https://maps.google.com" target="_blank" class="btn-row">
          <div class="icon-square">
            <i class="fas fa-church"></i>
          </div>
          <span class="btn-label">Local da Cerimônia</span>
        </a>

        <a href="https://maps.google.com" target="_blank" class="btn-row reverse">
          <div class="icon-square">
            <i class="fas fa-location-dot"></i>
          </div>
          <span class="btn-label">Local da Recepção</span>
        </a>

        <div class="btn-row" id="rsvpBtn">
          <div class="icon-square">
            <i class="fas fa-user-check"></i>
          </div>
          <span class="btn-label">Confirmar Presença</span>
        </div>

      </div>

    </div>
  
    <!-- FOTO DA PARTE INFERIOR -->
    <div class="bottom-section">
      <div class="waiting-text">
        Esperamos<br>por você!
      </div>
      <div class="bottom-photo-wrapper">
        <img src="imagens/rodape.jpg" alt="Foto Casal Rodapé" onerror="this.src='https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80'">
      </div>
    </div>

  </div>

  <!-- MODAL RSVP -->
  <div id="rsvpModal" class="modal">
    <div class="modal-content">
      <h3>Confirmação de Presença</h3>
      <form id="rsvpForm">
        <input type="text" id="nome" placeholder="Seu Nome Completo" required>
        <select id="presenca">
          <option value="Sim">Sim, estarei presente</option>
          <option value="Não">Não poderei ir</option>
        </select>
        <input type="number" id="acompanhantes" placeholder="Qtde de acompanhantes" min="0" value="0">
        <button type="submit" class="modal-btn">Enviar via WhatsApp</button>
        <button type="button" class="modal-btn btn-cancel" id="closeRsvpBtn">Cancelar</button>
      </form>
    </div>
  </div>

  <!-- JavaScript Local -->
  <script src="./script.js"></script>
</body>
</html>
